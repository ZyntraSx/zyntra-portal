<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zyntra</title>
<style>
:root{color-scheme:dark;--bh:150px;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07080c;color:#eef0f6;font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none}
#stage{position:fixed;left:0;right:0;top:0;bottom:var(--bh);overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(ellipse at 50% 0,#151a2b 0,#07080c 70%);padding-top:env(safe-area-inset-top,0px)}
#stage:active{cursor:grabbing}
#stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff14 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
#canvas{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content;will-change:transform}
#canvas.anim{transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.tree ul{display:flex;justify-content:center;padding:26px 0 0;margin:0;position:relative}
.tree>ul{padding-top:0}
.tree li{list-style:none;position:relative;padding:26px 9px 0;text-align:center}
.tree>ul>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:26px;border-top:2px solid var(--lc)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--lc)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--lc);border-radius:0 10px 0 0}
.tree li:first-child::after{border-radius:10px 0 0 0}
.tree>ul>li::before,.tree>ul>li::after{display:none}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--lc);height:26px}
.node{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:center;min-width:92px;max-width:170px;padding:9px 14px;border-radius:14px;font-size:15px;font-weight:500;cursor:pointer;position:relative;user-select:none;-webkit-user-select:none;color:#eef0f6;border:1.5px solid color-mix(in srgb,var(--c) 75%,transparent);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 24%,#0d0f15),#0d0f15 80%);box-shadow:0 0 16px color-mix(in srgb,var(--c) 22%,transparent),0 4px 10px #0008;transition:transform .18s,box-shadow .18s,opacity .25s,background .2s,color .2s}
.node:hover{transform:translateY(-2px);box-shadow:0 0 24px color-mix(in srgb,var(--c) 40%,transparent),0 6px 14px #000a}
.node.root{font-size:23px;font-weight:700;padding:12px 26px;border-width:2px}
.node.sel{background:var(--c);color:#06070a;box-shadow:0 0 30px color-mix(in srgb,var(--c) 60%,transparent)}
.node.dim{opacity:.32}
.node.empty{border-style:dashed}
.node.new{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.ic{font-size:16px}
.sub{flex-basis:100%;font-size:12px;font-weight:400;opacity:.7}
.badge{position:absolute;top:-10px;right:-10px;background:var(--c);color:#000;border-radius:11px;font-size:11px;font-weight:700;padding:2px 7px;box-shadow:0 2px 6px #000a}
.tools{position:fixed;right:10px;top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:5}
.tools button{width:42px;height:42px;border-radius:12px;border:1px solid #ffffff22;background:#12141cdd;backdrop-filter:blur(8px);color:#fff;font-size:18px;cursor:pointer}
.tools button:active{background:#2a2f40}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0e1016f2;backdrop-filter:blur(10px);border-top:1px solid #ffffff1a;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.hint{font-size:12px;color:#9aa0b2;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #ffffff2a;background:#05060a;color:#fff;font-size:16px}
.row{display:flex;gap:6px;margin-top:8px}
.row button{flex:1;min-width:0;padding:10px 4px;border-radius:10px;border:1px solid #ffffff22;background:#1a1d27;color:#fff;font-size:13px;cursor:pointer}
.row button.p{background:#fff;color:#000;border-color:#fff;font-weight:700}
.row button.d{color:#ff7b7b}
.row button:disabled{opacity:.3}
#links{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.lk{fill:none;stroke:#fff;stroke-opacity:.8;stroke-width:2;stroke-dasharray:6 5;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-22}}
.tree ul.vert{flex-direction:column;align-items:center}
.tree ul.vert>li{padding:14px 0 0}
.tree ul.vert>li::before{content:"";display:block;position:absolute;top:0;left:50%;right:auto;width:0;height:14px;border:0;border-left:2px solid var(--lc);border-radius:0}
.tree ul.vert>li::after{display:none}
.tree ul.vert>li:first-child{padding-top:0}
.tree ul.vert>li:first-child::before{display:none}
.addchip{display:none;position:absolute;left:50%;top:calc(100% + 2px);transform:translateX(-50%);z-index:4;white-space:nowrap;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;background:#fff;color:#000;box-shadow:0 2px 8px #000a}
.node.sel .addchip{display:block}
</style>
</head>
<body>
<div id="stage"><div id="canvas"><div class="tree" id="tree"></div><svg id="links"></svg></div></div>
<div class="tools">
  <button id="zi" title="Acercar">+</button><button id="zo" title="Alejar">−</button>
  <button id="fit" title="Ajustar">⤢</button><button id="exp" title="Expandir todo">⊞</button>
  <button id="cola" title="Plegar ramas">⊟</button><button id="rst" title="Reiniciar">↺</button>
</div>
<div class="bar" id="bar">
  <div class="hint" id="hint"></div>
  <input id="txt" placeholder="Nombre" autocomplete="off">
  <div class="row">
    <button class="p" id="add">+ Hijo</button><button id="ren">Renombrar</button>
    <button id="ml">◀</button><button id="mr">▶</button>
    <button id="col">Plegar</button><button class="d" id="del">Borrar</button>
  </div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var COLORS=["#4fc3f7","#81c784","#ffb74d","#ba68c8","#f06292","#fff176","#4db6ac"];
var KEY="zyntra-tree-v9";
var _i=0,LINKS=[["Journal","Estadísticas"]];
function N(name,ic,kids,sub,open){return{id:++_i,name:name,ic:ic||"",sub:sub||"",open:open!==false,kids:kids||[]}}
function L(a){return a.map(function(x){return N(x)})}
function A(arr,n){n.add=arr;return n}
function PH(){return A(["estrategia","archivo"],N("(Categoría)","📂",[A(["archivo"],N("(Nombre de la estrategia)","♟️",[N("(Archivos)","🗂️",[],"Ficha técnica, robot, código…")],"ej. Zyntra"))],"ej. Breakouts"))}
function NW(a){return a.map(function(x){return N(x[0],x[2],[],x[1])})}
function S4(){return [["Scalping","⚡"],["Day trading","📅"],["Swing trading","🌊"],["Position trading","🏔️"]].map(function(x){return N(x[0],x[1],[N("Sin nombre","➕"),N("Sin nombre","➕")])})}
function PT(name,ic,kids){return A(["categoría","estrategia","archivo"],N(name,ic,kids||[]))}
function fresh(){_i=0;return N("Zyntra","",[
 N("Indicadores","📈"),
 N("Estrategias","🧪",[N("Mean reversión","↔️"),N("Rupturas","🚀")]),
 N("APP","📱",[
  N("Journal","📓",[N("Nuevo trade","📝",L(["Fecha y hora de entrada","Fecha y hora de salida","Emociones","Observaciones / Notas","TP % (+)","SL % (+)","BE %","Activo","Long / Short","Setup / Estrategia","RR logrado","Guardar trade"]),"% solo del nivel tocado",false)],"Alimenta Estadísticas"),
  N("Estadísticas","📊",L(["Diario","Semanal","Mensual","Anual","Histórico"]),"Datos del Journal"),
  N("Centro de Trading","📰",[N("Agregar","➕"),N("Favoritos","⭐"),
   N("Brokers","🏦",L(["IC Markets","Pepperstone","XM","Exness","FP Markets","Eightcap","Admirals","OANDA","Interactive Brokers","Vantage","FXCM","Tickmill","AvaTrade","Axi","XTB","RoboForex","HFM","Darwinex","Saxo","Capital.com"]),"",false),
   N("Plataformas","📱",L(["MetaTrader 5","MetaTrader 4","TradingView","cTrader","dxTrade","NinjaTrader","Match-Trader","TradeLocker","Quantower","Sierra Chart","Tradovate","Thinkorswim"]),"",false),
   N("Prop Firms","🏆",L(["propXp","FTMO","MyForexFunds","The5ers","FundedNext","E8 Funding","Funding Pips","Apex Trader Funding","Topstep","Alpha Capital Group","Blue Guardian","Take Profit Trader","Goat Funded Trader","BrightFunded","Maven Trading","City Traders Imperium"]),"",false),
   N("Exchanges Crypto","🪙",L(["Binance","BingX","Bybit","OKX","Bitget","KuCoin","Kraken","Coinbase","Gate.io","MEXC","HTX","Bitfinex","BitMEX","Deribit","Hyperliquid","dYdX"]),"",false),
   N("Herramientas","🔧",L(["Myfxbook","Position Size Calc","Forex Factory","Investing.com","FXStreet","BabyPips","CoinGlass","CoinGecko","CoinMarketCap","Finviz","Trading Economics","Barchart"]),"",false)]),
  N("Señales","💸",[N("Scalping","⚡",[N("Sin nombre","➕"),N("Sin nombre","➕")]),N("Day trading","📅",[N("Sin nombre","➕"),N("Sin nombre","➕")]),N("Swing trading","🌊",[N("Sin nombre","➕"),N("Sin nombre","➕")]),N("Position trading","🏔️",[N("Sin nombre","➕"),N("Sin nombre","➕")])]),N("Bots","🤖",S4()),
  N("Portafolio Estrategias","📁",[PT("Scalping","⚡",[PH()]),PT("Day trading","📅",[PH()]),PT("Swing trading","🌊",[PH()]),PT("Position trading","🏔️",[PH()])]),
  N("Strategy Lab","🧪",[N("Strategy creador","🧬",[],"Crea estrategias automáticamente (tipo quant)"),
   N("Backtesting","📉",[
    N("Laboratorio de Estrategias","🧪",L(["Cargar CSV (datos OHLC requeridos)","Agregar indicador (técnico)","Ver indicadores activos","Ver resumen completo (JSON)","Cambiar nombre de estrategia","Guardar estrategia (local / servidor)"]),"",false),
    N("Configuración del Backtest","⚙️",L(["Capital inicial (USD/USDT)","Riesgo por operación (% del capital)","Comisión (% por orden)","Slippage (% estimado)","Spread (%)","Latencia (velas de retraso)","Apalancamiento (multiplicador)"]),"",false),
    N("Ejecutar backtest","▶️"),N("Historial de estrategias (JSON)","📜")])]),N("Calculadora","🧮"),N("Noticias","📰",NW([["Forex Factory","Calendario económico","📅"],["Investing.com","Noticias de mercado","📊"],["FXStreet","Análisis y noticias forex","🏦"],["TradingView News","Noticias del mercado","📈"],["DailyFX","Noticias y análisis","🌐"],["CoinDesk","Noticias cripto","₿"],["CoinTelegraph","Noticias cripto","🪙"],["ForexLive","Noticias en tiempo real","🏛️"],["Reuters","Noticias globales","📰"],["Bloomberg","Mercados y economía","📰"],["CNBC","Mercados en vivo","📺"],["MarketWatch","Noticias de mercado","📰"],["Yahoo Finance","Mercados y cotizaciones","📰"],["FXEmpire","Análisis forex y cripto","📰"],["The Block","Noticias cripto","🧱"],["Decrypt","Noticias cripto","📰"]])),
  N("Barra inferior","🧭",L(["Centro","Bots","Señales","Noticias","Ajustes"]),"",false)]),
 N("Sin nombre","➕")],"Inicio: 20/06/2026")}
function byName(n,name){if(n.name===name)return n;for(var i=0;i<n.kids.length;i++){var r=byName(n.kids[i],name);if(r)return r}return null}
function pos(el){var x=0,y=0,e=el;while(e&&e!==cv){x+=e.offsetLeft;y+=e.offsetTop;e=e.offsetParent}return{x:x,y:y,w:el.offsetWidth,h:el.offsetHeight}}
function drawLinks(){var sv=$("links"),h='<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>';
  LINKS.forEach(function(l){var a=byName(root,l[0]),b=byName(root,l[1]);if(!a||!b||!els[a.id]||!els[b.id])return;
    var A=pos(els[a.id]),B=pos(els[b.id]),x1=A.x+A.w,y1=A.y+A.h/2,x2=B.x,y2=B.y+B.h/2;
    h+='<path class="lk" d="M'+x1+' '+y1+' C '+(x1+26)+' '+(y1-46)+' '+(x2-26)+' '+(y2-46)+' '+x2+' '+y2+'" marker-end="url(#ar)"/>'});
  sv.innerHTML=h}
var root=fresh(),sel=null,nid=10000,els={},newIds={},moved=false,lastId=0,lastT=0;
try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.root){root=o.root;nid=o.nid||10000}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({root:root,nid:nid}))}catch(e){}}
function find(n,id,p){if(n.id===id)return{n:n,p:p};for(var i=0;i<n.kids.length;i++){var r=find(n.kids[i],id,n);if(r)return r}return null}
function count(n){var c=0;n.kids.forEach(function(k){c+=1+count(k)});return c}
function ids(n,o){o[n.id]=1;n.kids.forEach(function(k){ids(k,o)});return o}
function anc(n,id,a){if(n.id===id)return true;for(var i=0;i<n.kids.length;i++){if(anc(n.kids[i],id,a)){a[n.id]=1;return true}}return false}
function build(n,depth,idx,color){
  var li=document.createElement("li"),c=depth===1?COLORS[idx%COLORS.length]:color;
  li.style.setProperty("--lc",depth===0?"#4a4f5c":c+"aa");
  var d=document.createElement("div");
  d.className="node"+(depth===0?" root":"")+(n.name==="Sin nombre"||n.name.charAt(0)==="("?" empty":"")+(newIds[n.id]?" new":"");
  d.style.setProperty("--c",depth===0?"#e8eaf0":c);
  if(n.ic){var ic=document.createElement("span");ic.className="ic";ic.textContent=n.ic;d.appendChild(ic)}
  var t=document.createElement("span");t.textContent=n.name;d.appendChild(t);
  if(n.sub){var sb=document.createElement("span");sb.className="sub";sb.textContent=n.sub;d.appendChild(sb)}
  if(n.kids.length&&!n.open){var b=document.createElement("span");b.className="badge";b.textContent="+"+count(n);d.appendChild(b)}
  if(n.add&&n.add.length){var ch=document.createElement("span");ch.className="addchip";ch.textContent="+ Agregar "+n.add[0];
    ch.onclick=function(e){e.stopPropagation();var id=nid++,c2={id:id,name:"Sin nombre",ic:"",sub:"",open:true,kids:[]};if(n.add.length>1)c2.add=n.add.slice(1);
      n.kids.push(c2);n.open=true;newIds[id]=1;render();select(id);setTimeout(function(){centerOn(els[id])},30)};d.appendChild(ch)}
  d.onclick=function(){
    if(moved)return;var now=Date.now();
    if(n.kids.length&&!n.open){n.open=true;render();select(n.id);lastId=0;return}
    if(lastId===n.id&&now-lastT<320&&n.kids.length){n.open=!n.open;render()}else{select(n.id)}
    lastId=n.id;lastT=now};
  els[n.id]=d;li.appendChild(d);
  if(n.kids.length&&n.open){var ul=document.createElement("ul");if(n.kids.length>=3&&n.kids.every(function(k){return!k.kids.length}))ul.className="vert";n.kids.forEach(function(k,i){ul.appendChild(build(k,depth+1,depth===0?i:idx,c))});li.appendChild(ul)}
  return li}
function render(){
  els={};var t=$("tree");t.innerHTML="";var ul=document.createElement("ul");
  ul.appendChild(build(root,0,0,"#fff"));t.appendChild(ul);newIds={};applySel();drawLinks();save()}
function select(id){sel=id;var r=find(root,id,null);$("txt").value=r&&r.n.name!=="Sin nombre"?r.n.name:"";applySel()}
function applySel(){
  var r=sel?find(root,sel,null):null;if(!r)sel=null;
  var keep={};if(r){ids(r.n,keep);anc(root,sel,keep)}
  for(var k in els){els[k].classList.toggle("sel",+k===sel);els[k].classList.toggle("dim",!!sel&&!keep[k])}
  $("hint").textContent=r?r.n.name+(r.n.kids.length?" · "+r.n.kids.length+" hijos":""):"Arrastrá para mover · pellizcá para zoom · doble toque = plegar";
  ["add","ren","col","del","ml","mr"].forEach(function(i){$(i).disabled=!r});
  if(r&&!r.p){$("del").disabled=true;$("ml").disabled=true;$("mr").disabled=true}
  $("col").textContent=r&&r.n.kids.length&&!r.n.open?"Desplegar":"Plegar"}
var armed={};
function twoTap(btn,key,label,fn){if(armed[key]){clearTimeout(armed[key]);armed[key]=0;btn.textContent=label;fn()}else{btn.textContent="¿Seguro?";armed[key]=setTimeout(function(){armed[key]=0;btn.textContent=label},3000)}}
$("add").onclick=function(){var r=find(root,sel,null);if(!r)return;var id=nid++;
  r.n.kids.push(N(id,$("txt").value.trim()||"Sin nombre"));r.n.open=true;newIds[id]=1;render();select(id);$("txt").value="";
  setTimeout(function(){centerOn(els[id])},30)};
$("ren").onclick=function(){var r=find(root,sel,null),v=$("txt").value.trim();if(!r||!v)return;r.n.name=v;render()};
$("col").onclick=function(){var r=find(root,sel,null);if(!r||!r.n.kids.length)return;r.n.open=!r.n.open;render()};
function mv(d){var r=find(root,sel,null);if(!r||!r.p)return;var a=r.p.kids,i=a.indexOf(r.n),j=i+d;if(j<0||j>=a.length)return;a[i]=a[j];a[j]=r.n;render()}
$("ml").onclick=function(){mv(-1)};$("mr").onclick=function(){mv(1)};
$("del").onclick=function(){var r=find(root,sel,null);if(!r||!r.p)return;
  var go=function(){r.p.kids=r.p.kids.filter(function(k){return k.id!==sel});sel=null;$("txt").value="";render()};
  if(r.n.kids.length)twoTap($("del"),"d","Borrar",go);else go()};
function setAll(n,v,top){n.kids.forEach(function(k){k.open=v;setAll(k,v)})}
$("exp").onclick=function(){root.open=true;setAll(root,true);render();fit()};
$("cola").onclick=function(){root.open=true;setAll(root,false);render();fit()};
$("rst").onclick=function(){twoTap($("rst"),"r","↺",function(){root=fresh();sel=null;render();fit()})};
/* pan / zoom */
var st={x:0,y:0,k:1},stage=$("stage"),cv=$("canvas"),raf=0,vx=0,vy=0,ptrs={},pd=null,sx=0,sy=0;
function apply(){cv.style.transform="translate("+st.x+"px,"+st.y+"px) scale("+st.k+")"}
function anim(){cv.classList.add("anim");setTimeout(function(){cv.classList.remove("anim")},420)}
function zoomAt(f,cx,cy){var nk=Math.min(2.5,Math.max(.25,st.k*f));f=nk/st.k;st.x=cx-(cx-st.x)*f;st.y=cy-(cy-st.y)*f;st.k=nk;apply()}
function fit(){anim();var w=cv.offsetWidth,sw=stage.clientWidth;var k=Math.max(.45,Math.min(1,(sw-24)/w));st.k=k;st.x=(sw-w*k)/2;st.y=24;apply()}
function centerOn(el){if(!el)return;anim();var r=el.getBoundingClientRect(),s=stage.getBoundingClientRect();
  st.x+=s.left+s.width/2-(r.left+r.width/2);st.y+=s.top+s.height/2-(r.top+r.height/2);apply()}
function zoomBtn(f){anim();zoomAt(f,stage.clientWidth/2,stage.clientHeight/2)}
$("zi").onclick=function(){zoomBtn(1.3)};$("zo").onclick=function(){zoomBtn(1/1.3)};$("fit").onclick=fit;
stage.addEventListener("pointerdown",function(e){cancelAnimationFrame(raf);vx=vy=0;ptrs[e.pointerId]={x:e.clientX,y:e.clientY};
  if(Object.keys(ptrs).length===1){moved=false;sx=e.clientX;sy=e.clientY}pd=null});
window.addEventListener("pointermove",function(e){var p=ptrs[e.pointerId];if(!p)return;var k=Object.keys(ptrs);
  if(k.length===1){var dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>6)moved=true;
    if(moved){st.x+=dx;st.y+=dy;vx=dx;vy=dy;apply()}p.x=e.clientX;p.y=e.clientY}
  else if(k.length===2){p.x=e.clientX;p.y=e.clientY;var a=ptrs[k[0]],b=ptrs[k[1]];
    var d=Math.hypot(a.x-b.x,a.y-b.y),r=stage.getBoundingClientRect();moved=true;vx=vy=0;
    if(pd)zoomAt(d/pd,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);pd=d}});
function up(e){if(!ptrs[e.pointerId])return;delete ptrs[e.pointerId];pd=null;
  if(!Object.keys(ptrs).length&&moved&&Math.abs(vx)+Math.abs(vy)>2){(function step(){vx*=.93;vy*=.93;st.x+=vx;st.y+=vy;apply();if(Math.abs(vx)+Math.abs(vy)>.4)raf=requestAnimationFrame(step)})()}}
window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
stage.addEventListener("wheel",function(e){e.preventDefault();var r=stage.getBoundingClientRect();zoomAt(e.deltaY<0?1.1:.9,e.clientX-r.left,e.clientY-r.top)},{passive:false});
stage.addEventListener("click",function(e){if(e.target===stage||e.target===cv||e.target.id==="tree"){if(!moved){sel=null;$("txt").value="";applySel()}}});
function setBh(){document.documentElement.style.setProperty("--bh",$("bar").offsetHeight+"px")}
window.addEventListener("resize",setBh);
setBh();render();requestAnimationFrame(function(){cv.classList.remove("anim");fit()});
</script>
</body>
</html>
